name: Test dotfiles install

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run install tests
        run: bash test.sh --auto --branch "${{ github.head_ref || github.ref_name }}"
